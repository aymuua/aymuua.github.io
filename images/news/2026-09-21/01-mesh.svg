  <pattern id="tight" width="46" height="74" patternUnits="userSpaceOnUse"><path d="M23 0 46 37 23 74 0 37Z" fill="none" stroke="#363636" stroke-width="2"/></pattern>
  <rect x="78" y="84" width="310" height="372" fill="url(#wide)" stroke="#111" stroke-width="3"/>
  <rect x="630" y="84" width="214" height="372" fill="url(#tight)" stroke="#111" stroke-width="3"/>
  <path d="M445 270h126m-22-22 22 22-22 22" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="232" cy="270" r="12" fill="#111"/><circle cx="736" cy="270" r="12" fill="#111"/>
