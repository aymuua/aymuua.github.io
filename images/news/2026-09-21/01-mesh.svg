<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">网状机构收缩示意</title>
  <desc id="desc">左侧展开的菱形网格经过箭头指向右侧收缩后的网格。</desc>
  <rect width="960" height="540" fill="#f7f7f5"/>
